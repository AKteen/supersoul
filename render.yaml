# Render Blueprint: API + Postgres + Key Value (Redis).
# Frontend is deployed separately on Vercel. Set CORS_ORIGINS to that site URL.
services:
  - type: web
    name: supersoul-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: supersoul-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: supersoul-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: CORS_ORIGINS
        sync: false
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: AGORA_CHAT_APP_KEY
        sync: false
      - key: AGORA_CHAT_REST_HOST
        sync: false

  - type: keyvalue
    name: supersoul-redis
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: supersoul-postgres
    databaseName: supersoul
    user: supersoul
